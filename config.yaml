# LastZ Automation — Alliance Gifts (includes Battlefield chest)
# Edit thresholds/intervals here; no code changes needed for normal tuning.
# Clicks are full-dynamic: template match centers + window-fraction dismiss.

game:
  process_name: Survival.exe   # Activity Monitor / CrossOver process name

# CrossOver bottle helpers (menu option 3 — Fix Hebrew)
crossover:
  bottle_name: "Last Z"        # ~/Library/Application Support/CrossOver/Bottles/<name>

paths:
  templates_dir: templates/active
  logs_dir: logs

thresholds:
  claim_all: 0.82
  claim_button: 0.72
  orange_icon: 0.82            # Battlefield Gifts chest on wilderness map
  alliance_shield: 0.7
  alliance_gifts: 0.7
  rare_tab: 0.78
  alliance_techs: 0.7
  tech_thumbs_up: 0.78
  tech_hex_active: 0.65
  donate_blue: 0.75
  hq_world_button: 0.7         # HQ mode: World button (leave HQ)
  wilderness_hq_button: 0.7    # Wilderness: Headquarters button (enter HQ)
  drone_gift_chest: 0.58
  drone_claim_btn: 0.55
  drone_collect_btn: 0.55
  trucks_icon: 0.72
  trucks_my_truck_tab: 0.65
  trucks_claim_chest: 0.70
  trucks_slot_plus: 0.70
  trucks_refresh: 0.62         # soft — second refresh after Tips can read ~0.65
  trucks_go: 0.70
  trucks_details_back: 0.70
  help_button: 0.75
  healing_wounded: 0.72        # Bandage icon (troops need healing)
  healing_ask_help: 0.72       # Ask alliance to speed up healing
  healing_complete: 0.72       # Healing done, collect troops
  healing_heal_button: 0.75    # Big "Heal" button in modal
  healing_minus_button: 0.72   # "-" stepper on troop row (batch size entry)
  healing_plus_button: 0.75    # "+" stepper on troop row (batch size entry)
  quit_tips: 0.75              # Tips modal "Exit the game?" text
  quit_cancel: 0.75            # blue Cancel on Quit Tips (not the tiny X)
  heli_br_icon: 0.70
  heli_coords: 0.65
  heli_march: 0.65
  heli_zzz: 0.60
  heli_search: 0.65
  heli_prize: 0.60
  heli_alliance_tab: 0.65

alliance_techs:
  max_donates: 20              # stop blue Donate loop after this many clicks

# Placing trucks (end of menu 1 / watcher). Set include_trucks_flow: false to skip.
trucks:
  include_trucks_flow: true    # false = leave trucks fully manual
  allow_purple_trucks: false   # true = accept purple; false = refresh for orange only
  max_refreshes: 15            # safety cap; if still not orange → abort (never send gray/green)
  open_every_n_runs: 5         # also open every Nth gifts run (badge always opens)
  # Discover ALL tracks in this band (yf0,yf1,xf0,xf1), then use ONLY the uppermost.
  # If upper is occupied, leave it — never click a lower empty +.
  highway_band: [0.10, 0.78, 0.28, 0.72]
  save_color_debug: true       # ROI+mask crops in logs/debug/trucks/color/ (VERIFY labels)
  # An en-route (already-sent) truck can render with NO +/chest/color signal
  # at all, so it silently vanishes from discovery instead of showing as
  # "occupied" — every lower lane then shifts up and the topmost VISIBLE one
  # gets mistaken for the true upper slot (caused a real double-send, see
  # logs/runs.log 2026-08-01 ~05:44). expected_track_count is how many
  # lanes exist when all are cleanly visible (used to safely learn the true
  # row-1 position); top_row_tolerance is how far below that learned
  # position a slot can still be trusted as "upper" before we refuse to
  # send (fail-safe) instead of guessing.
  expected_track_count: 4
  top_row_tolerance: 0.05

# Menu 4 — click Alliance Help handshake as soon as it blinks (BR 1/8 only).
help_watcher:
  poll_sec: 0.05               # lower = faster, more CPU
  # bottom-right 1/8 of game window (yf0, yf1, xf0, xf1)
  band: [0.50, 1.0, 0.75, 1.0]

# Healing (runs in parallel with Help watcher, prioritized)
healing:
  enabled: true                # false = skip healing entirely
  batch_size: 50               # total troops to heal per batch (not per type)
  check_interval_sec: 5.0      # how often to check for healing icons (slower than help poll)
  # Left-bottom HUD area for healing icons (yf0, yf1, xf0, xf1)
  icon_band: [0.75, 1.0, 0.0, 0.20]

drone_gift:
  min_duration: "08:00:00"     # collect only when Exploration Duration >= this
  # Physical-pixel rects relative to reference capture; scaled at runtime
  timer_crop_offset:           # [dx, dy, w, h] from chest match center
  - -77
  - 8
  - 150
  - 28
  modal_timer_region:          # [x, y, w, h] on Idle Reward modal
  - 1200
  - 730
  - 1200
  - 130

watcher:
  alliance_interval_sec: 180   # seconds between claim runs in menu option 2

# Motivation stats — itemized loot ledger (Alliance Gifts / Battlefield / Drone)
stats:
  enabled: true
  path: data/motivation_stats.json

# Helicopter (Explore Treasure) — priority over gifts in watcher (menu 2)
helicopter:
  enabled: false
  poll_sec: 1.0                 # BR indication poll interval
  br_band: [0.55, 0.95, 0.78, 1.0]
  search_max_sec: 1200          # Explore icon click allowed when timer ≤ 00:20:00 — the shared explore
                                 # progress (from all joined alliance members) can finish well before this
                                 # formation's own march timer hits 5:00, so waiting that long is too late
  prize_at_sec: 1               # start the sustained burst window when timer ≤ 00:00:01 (or prize sighted)
  prize_clicks: 120             # clicks fired per burst repetition within the sustained window
  prize_interval: 0.003
  prize_burst_span_sec: 8.0     # keep re-firing bursts for this long once the window is entered — the
                                 # actual claim window is confirmed too short to catch with one reactive
                                 # shot, so this sprays continuously across the predicted moment instead
  thank_you_text: "Thank You from LastZ-Automation"
  # Click empty land relative to map center (next to heli)
  empty_land_offset_frac: [-0.04, 0.06]
  wait_search_timeout_sec: 7200
  wait_prize_timeout_sec: 600

coordinates:
  # Empty-map dismiss as fractions of the current game window (w, h)
  dismiss_outside_frac:
  - 0.06
  - 0.28
